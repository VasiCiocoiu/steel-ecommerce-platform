services:
  ###> doctrine/doctrine-bundle ###
  db:
    image: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: MYSQL_ALLOW_EMPTY_PASSWORD=yes
      MYSQL_DATABASE: app

  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: MONGO_ALLOW_EMPTY_USERNAME=yes
      MONGO_INITDB_ROOT_PASSWORD: MONGO_ALLOW_EMPTY_PASSWORD=yes

  # mongo-express:
  #   image: mongo-express
  #   restart: always
  #   ports:
  #     - 8081:8081
  #   environment:
  #     ME_CONFIG_MONGODB_ADMINUSERNAME: ALLOW_EMPTY_USERNAME=yes
  #     ME_CONFIG_MONGODB_ADMINPASSWORD: ALLOW_EMPTY_PASSWORD=yes
  #     ME_CONFIG_MONGODB_URL: mongodb://127.0.0.1:27017/
  #     ME_CONFIG_BASICAUTH: false

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
    ###< doctrine/doctrine-bundle ###
